<div class="mx-auto max-w-6xl space-y-5">
  <div>
    <a routerLink="/incidencias" class="etiqueta hover:text-neon">← Incidencias</a>
    <h2 class="mt-1 text-2xl font-bold text-slate-100">Registrar incidencia</h2>
    <p class="mt-1 text-sm text-slate-500">
      Las asociaciones (personas, autoridades, elementos) se agregan después, desde el detalle.
    </p>
  </div>

  <form class="panel grid gap-4 p-6 md:grid-cols-2" (ngSubmit)="crear()">
    <div>
      <label class="campo-etiqueta obligatorio" for="incCentro">Centro penitenciario</label>
      <rw-select-buscable
        idCampo="incCentro"
        name="idCentroPenitenciario"
        required
        [opciones]="aOpciones(centros())"
        [(ngModel)]="forma.idCentroPenitenciario"
      />
    </div>
    <div>
      <label class="campo-etiqueta obligatorio" for="incTipo">Tipo de incidencia</label>
      <rw-select-buscable
        idCampo="incTipo"
        name="idTipoIncidencia"
        required
        [opciones]="aOpciones(tipos())"
        [(ngModel)]="forma.idTipoIncidencia"
      />
    </div>
    <div>
      <label class="campo-etiqueta obligatorio" for="incFecha">Fecha y hora</label>
      <rw-selector-fecha
        idCampo="incFecha"
        name="fecha"
        [conHora]="true"
        required
        [(ngModel)]="forma.fecha"
      />
    </div>
    <div>
      <label class="campo-etiqueta" for="incIph">IPH</label>
      <input
        class="campo font-mono"
        id="incIph"
        name="iph"
        maxlength="100"
        [(ngModel)]="forma.iph"
      />
    </div>
    <div class="md:col-span-2">
      <label class="campo-etiqueta obligatorio" for="incDescripcion">Descripción</label>
      <textarea
        class="campo"
        id="incDescripcion"
        name="descripcion"
        rows="3"
        maxlength="2000"
        required
        [(ngModel)]="forma.descripcion"
      ></textarea>
    </div>
    <div>
      <label class="campo-etiqueta" for="incPrimerRespondiente"
        >Primer respondiente (texto libre)</label
      >
      <input
        class="campo"
        id="incPrimerRespondiente"
        name="primerRespondiente"
        maxlength="255"
        [(ngModel)]="forma.primerRespondiente"
      />
      <p class="mt-1 text-[11px] text-slate-600">
        Úsalo cuando el elemento NO está en el padrón (RF-INC-007); si está registrado, asócialo en
        el detalle.
      </p>
    </div>
    <div class="md:col-span-2">
      <label class="campo-etiqueta" for="incNarrativa">Narrativa</label>
      <textarea
        class="campo"
        id="incNarrativa"
        name="narrativa"
        rows="4"
        [(ngModel)]="forma.narrativa"
      ></textarea>
    </div>
    @if (error()) {
      <p class="alerta-error md:col-span-2">{{ error() }}</p>
    }
    <div class="flex justify-end md:col-span-2">
      <button class="btn-primario" type="submit" [disabled]="guardando()">
        {{ guardando() ? 'Guardando…' : 'Registrar incidencia' }}
      </button>
    </div>
  </form>
</div>
