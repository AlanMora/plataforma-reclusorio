<form class="space-y-5" (ngSubmit)="guardar()">
  @if (error()) {
    <p class="alerta-error whitespace-pre-line">{{ error() }}</p>
  }

  <div class="grid gap-4 md:grid-cols-3">
    <div>
      <label class="campo-etiqueta obligatorio" for="primerNombre">Nombre(s)</label>
      <input
        class="campo"
        id="primerNombre"
        name="primerNombre"
        maxlength="150"
        required
        [(ngModel)]="modelo.primerNombre"
      />
    </div>
    <div>
      <label class="campo-etiqueta" for="apellidoPaterno">Apellido paterno</label>
      <input
        class="campo"
        id="apellidoPaterno"
        name="apellidoPaterno"
        maxlength="150"
        [(ngModel)]="modelo.apellidoPaterno"
      />
    </div>
    <div>
      <label class="campo-etiqueta" for="apellidoMaterno">Apellido materno</label>
      <input
        class="campo"
        id="apellidoMaterno"
        name="apellidoMaterno"
        maxlength="150"
        [(ngModel)]="modelo.apellidoMaterno"
      />
    </div>
    <div>
      <label class="campo-etiqueta obligatorio" for="curp">CURP</label>
      <input
        class="campo font-mono uppercase"
        id="curp"
        name="curp"
        maxlength="18"
        required
        placeholder="18 caracteres"
        [(ngModel)]="modelo.curp"
      />
    </div>
    <div>
      <label class="campo-etiqueta obligatorio" for="fechaNacimiento">Fecha de nacimiento</label>
      <input
        class="campo"
        id="fechaNacimiento"
        name="fechaNacimiento"
        type="date"
        required
        [(ngModel)]="modelo.fechaNacimiento"
      />
      <p class="mt-1 text-[11px] text-slate-600">
        La edad SIEMPRE se calcula; nunca se captura (RF-GEN-008).
      </p>
    </div>
    <div>
      <label class="campo-etiqueta" for="alias">Alias</label>
      <input class="campo" id="alias" name="alias" maxlength="150" [(ngModel)]="modelo.alias" />
    </div>
    <div>
      <label class="campo-etiqueta" for="genero">Género</label>
      <rw-select-buscable
        idCampo="genero"
        name="genero"
        [opciones]="generosOpciones()"
        [(ngModel)]="modelo.genero"
      />
    </div>
    <div>
      <label class="campo-etiqueta" for="estadoCivil">Estado civil</label>
      <rw-select-buscable
        idCampo="estadoCivil"
        name="estadoCivil"
        [opciones]="estadosCivilesOpciones()"
        [(ngModel)]="modelo.estadoCivil"
      />
    </div>
    <div>
      <label class="campo-etiqueta" for="nivelEducativo">Nivel educativo</label>
      <rw-select-buscable
        idCampo="nivelEducativo"
        name="nivelEducativo"
        [opciones]="nivelesEducativosOpciones()"
        [(ngModel)]="modelo.nivelEducativo"
      />
    </div>
    <div>
      <label class="campo-etiqueta" for="ocupacion">Ocupación</label>
      <rw-select-buscable
        idCampo="ocupacion"
        name="ocupacion"
        [opciones]="ocupacionesOpciones()"
        [(ngModel)]="modelo.ocupacion"
      />
    </div>
    <div>
      <label class="campo-etiqueta" for="nacionalidad">Nacionalidad</label>
      <rw-select-buscable
        idCampo="nacionalidad"
        name="nacionalidad"
        [opciones]="nacionalidadesOpciones()"
        [(ngModel)]="modelo.nacionalidad"
      />
    </div>
    <div>
      <label class="campo-etiqueta" for="estadoNacimiento">Estado de nacimiento</label>
      <rw-select-buscable
        idCampo="estadoNacimiento"
        name="estadoNacimiento"
        [opciones]="estadosNacimientoOpciones()"
        [(ngModel)]="modelo.estadoNacimiento"
      />
    </div>
    <div>
      <label class="campo-etiqueta" for="numeroTelefono">Teléfono</label>
      <input
        class="campo"
        id="numeroTelefono"
        name="numeroTelefono"
        maxlength="50"
        [(ngModel)]="modelo.numeroTelefono"
      />
    </div>
  </div>

  <div class="flex justify-end gap-3">
    <button class="btn-primario" type="submit" [disabled]="guardando()">
      {{
        guardando() ? 'Guardando…' : modo() === 'crear' ? 'Registrar persona' : 'Guardar cambios'
      }}
    </button>
  </div>
</form>
