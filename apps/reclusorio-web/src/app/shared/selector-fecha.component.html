<div class="relative" (keydown.escape)="cerrarConEscape($event)">
  <button
    #botonFecha
    class="campo flex items-center justify-between gap-2 text-left"
    type="button"
    [id]="idCampo()"
    [disabled]="deshabilitado()"
    (click)="alternar(botonFecha)"
  >
    <span class="truncate" [class.text-slate-600]="!valor()">
      {{ textoVisible() || (conHora() ? 'dd/mm/aaaa hh:mm' : 'dd/mm/aaaa') }}
    </span>
    <rw-icono class="text-slate-500" nombre="calendario" [tamano]="16" />
  </button>

  @if (abierto()) {
    <div
      class="absolute left-0 z-[1100] w-72 rounded-lg border border-borde bg-panel-2 p-3 shadow-xl shadow-black/50"
      [class.top-full]="!haciaArriba()"
      [class.mt-1]="!haciaArriba()"
      [class.bottom-full]="haciaArriba()"
      [class.mb-1]="haciaArriba()"
    >
      <!-- Navegación de mes / año -->
      <div class="flex items-center gap-1.5">
        <button
          class="flex h-7 w-7 shrink-0 items-center justify-center rounded-md border border-borde text-slate-400 hover:border-neon/40 hover:text-neon"
          type="button"
          title="Mes anterior"
          (click)="mesAnterior()"
        >
          <rw-icono nombre="anterior" [tamano]="15" />
        </button>
        <select
          class="campo grow px-2 py-1 text-xs"
          (change)="mesVisible.set(+$any($event.target).value)"
          aria-label="Mes"
        >
          @for (m of meses; track m; let i = $index) {
            <option [value]="i" [selected]="i === mesVisible()">{{ m }}</option>
          }
        </select>
        <select
          class="campo w-20 shrink-0 px-2 py-1 text-xs"
          (change)="anioVisible.set(+$any($event.target).value)"
          aria-label="Año"
        >
          @for (a of anios(); track a) {
            <option [value]="a" [selected]="a === anioVisible()">{{ a }}</option>
          }
        </select>
        <button
          class="flex h-7 w-7 shrink-0 items-center justify-center rounded-md border border-borde text-slate-400 hover:border-neon/40 hover:text-neon"
          type="button"
          title="Mes siguiente"
          (click)="mesSiguiente()"
        >
          <rw-icono nombre="siguiente" [tamano]="15" />
        </button>
      </div>

      <!-- Días de la semana -->
      <div class="mt-3 grid grid-cols-7 text-center">
        @for (d of diasSemana; track d) {
          <span class="py-1 font-mono text-[9px] uppercase tracking-widest text-slate-600">
            {{ d }}
          </span>
        }
      </div>

      <!-- Días del mes -->
      <div class="grid grid-cols-7 gap-0.5">
        @for (celda of celdas(); track $index) {
          @if (celda === null) {
            <span></span>
          } @else {
            <button
              class="flex h-8 items-center justify-center rounded-md text-xs transition-colors"
              type="button"
              [class]="claseDia(celda)"
              [class.hover:bg-neon/10]="!diaNoPermitido(celda)"
              [disabled]="diaNoPermitido(celda)"
              (click)="elegirDia(celda)"
            >
              {{ celda }}
            </button>
          }
        }
      </div>

      <!-- Hora -->
      @if (conHora()) {
        <div class="mt-3 flex items-center gap-2 border-t border-borde pt-3">
          <span class="font-mono text-[9px] uppercase tracking-widest text-slate-600">Hora</span>
          <select
            class="campo w-16 px-2 py-1 text-center text-xs"
            [value]="hora()"
            (change)="cambiarHora($any($event.target).value, minuto())"
            aria-label="Hora"
          >
            @for (h of horas; track h) {
              <option [value]="h">{{ h }}</option>
            }
          </select>
          <span class="text-slate-500">:</span>
          <select
            class="campo w-16 px-2 py-1 text-center text-xs"
            [value]="minuto()"
            (change)="cambiarHora(hora(), $any($event.target).value)"
            aria-label="Minutos"
          >
            @for (m of minutos; track m) {
              <option [value]="m">{{ m }}</option>
            }
          </select>
        </div>
      }

      <!-- Acciones -->
      <div class="mt-3 flex items-center gap-2 border-t border-borde pt-3">
        <button
          class="btn-secundario btn-mini"
          type="button"
          [disabled]="!hoyPermitido()"
          (click)="hoy()"
        >
          {{ conHora() ? 'Ahora' : 'Hoy' }}
        </button>
        <button class="btn-secundario btn-mini" type="button" (click)="limpiar()">Limpiar</button>
        @if (conHora()) {
          <button class="btn-primario btn-mini ml-auto" type="button" (click)="cerrar()">
            <rw-icono nombre="correcto" [tamano]="14" />
            Listo
          </button>
        }
      </div>
    </div>
  }
</div>
