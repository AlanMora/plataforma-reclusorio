<div class="relative" (keydown.escape)="cerrarConEscape($event)">
  <button
    #botonSelect
    class="campo flex items-center justify-between gap-2 text-left"
    type="button"
    [id]="idCampo()"
    [disabled]="deshabilitado()"
    (click)="alternar(botonSelect)"
  >
    <span class="truncate" [class.text-slate-600]="!valor()">{{
      etiquetaSeleccionada() || placeholder()
    }}</span>
    <rw-icono class="text-slate-500" nombre="seleccionar" [tamano]="15" />
  </button>

  @if (abierto()) {
    <div
      class="absolute left-0 right-0 z-[1100] overflow-hidden rounded-lg border border-borde bg-panel-2 shadow-xl shadow-black/50"
      [class.top-full]="!haciaArriba()"
      [class.mt-1]="!haciaArriba()"
      [class.bottom-full]="haciaArriba()"
      [class.mb-1]="haciaArriba()"
    >
      <div class="border-b border-borde p-2">
        <input
          #campoBusqueda
          class="campo"
          type="text"
          placeholder="Buscar…"
          autocomplete="off"
          [value]="filtro()"
          (input)="filtro.set(campoBusqueda.value)"
          (keydown.enter)="elegirPrimera($event)"
          (keydown.escape)="cerrar()"
        />
      </div>
      <ul class="max-h-56 overflow-y-auto">
        <li>
          <button
            class="block w-full px-3 py-2 text-left text-xs text-slate-500 hover:bg-neon/10 hover:text-neon"
            type="button"
            (click)="elegir('')"
          >
            {{ placeholder() }}
          </button>
        </li>
        @for (o of filtradas(); track o.valor) {
          <li>
            <button
              class="block w-full px-3 py-2 text-left text-xs hover:bg-neon/10 hover:text-neon"
              [class.text-neon]="o.valor === valor()"
              [class.text-slate-300]="o.valor !== valor()"
              type="button"
              (click)="elegir(o.valor)"
            >
              {{ o.etiqueta }}
            </button>
          </li>
        }
        @if (textoLibre()) {
          <li>
            <button
              class="block w-full border-t border-borde px-3 py-2 text-left text-xs text-neon hover:bg-neon/10"
              type="button"
              (click)="elegir(textoLibre())"
            >
              Usar «{{ textoLibre() }}»
            </button>
          </li>
        }
        @if (filtradas().length === 0 && !textoLibre()) {
          <li class="px-3 py-2 text-xs text-slate-600">Sin coincidencias.</li>
        }
      </ul>
    </div>
  }
</div>
