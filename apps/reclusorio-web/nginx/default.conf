# =====================================================================
# nginx de producción del frontend — mismo contrato que proxy.conf.json:
#   /api → gateway, /socket.io → realtime (WS), resto → SPA Angular.
# TLS con certificado en /etc/nginx/certs (autofirmado si no se monta uno).
# =====================================================================

# WebSocket: propagar el upgrade solo cuando el cliente lo pide.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Todo HTTP redirige a HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /usr/share/nginx/html;
    index index.html;

    # Resolver interno de Docker con TTL corto: los upstreams se resuelven
    # por variable en cada petición, así nginx arranca aunque los servicios
    # aún no existan y sigue funcionando si Swarm los reubica.
    resolver 127.0.0.11 valid=10s;

    # Subida de archivos (expedientes) — el backend valida tamaño/tipo.
    client_max_body_size 50m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Las tres locations de proxy usan ^~ para que ganen SIEMPRE sobre la
    # location regex de estáticos: sin esto, una URL firmada de archivo que
    # termina en .png/.jpg cae en try_files y nginx responde 404 en vez de
    # proxearla a MinIO.

    # API → gateway (única entrada pública HTTP del backend).
    location ^~ /api/ {
        set $gateway http://gateway-service:3000;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Archivos (descargas y vista previa): URLs firmadas de MinIO servidas
    # por el MISMO origen del sitio. Requiere S3_PUBLIC_ENDPOINT=https://<host>
    # en el backend; la firma AWS V4 valida el Host recibido, así que se
    # propaga tal cual y la ruta no se toca. El nombre coincide con el bucket
    # (S3_BUCKET_RECLUSORIO, por defecto reclusorio-archivos).
    location ^~ /reclusorio-archivos/ {
        set $minio http://minio:9000;
        proxy_pass $minio;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        # add_header propio: NO heredar X-Frame-Options DENY del server,
        # porque la vista previa de PDF carga estos archivos en un iframe.
        add_header X-Content-Type-Options nosniff always;
    }

    # WebSocket → realtime (revocación de sesión, RF-SES-009).
    location ^~ /socket.io/ {
        set $realtime http://realtime-service:3009;
        proxy_pass $realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
    }

    # Estáticos con hash en el nombre: cache agresiva.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Rutas de Angular: siempre index.html (SPA), sin cache.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store";
    }
}
