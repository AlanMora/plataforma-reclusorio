# Promtail de producción (Swarm, modo global: uno por nodo). Descubre los
# contenedores del stack "reclusorio" por la API de Docker y manda su salida
# a Loki. Los servicios escriben JSON de pino: se extrae el nivel como label
# (pocos valores); userId, username, correlationId, url, etc. se consultan en
# Grafana con `| json` sin convertirlos en labels (alta cardinalidad).
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: reclusorio
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ['com.docker.stack.namespace=reclusorio']
    relabel_configs:
      # reclusorio_auth-service -> service="auth-service"
      - source_labels: ['__meta_docker_container_label_com_docker_swarm_service_name']
        regex: 'reclusorio_(.*)'
        target_label: service
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - replacement: reclusorio
        target_label: stack
    pipeline_stages:
      - json:
          expressions:
            nivel: level
      # pino usa números: 30 info, 40 warn, 50 error, 60 fatal.
      - template:
          source: nivel
          template: >-
            {{ if eq .Value "60" }}fatal{{ else if eq .Value "50" }}error{{ else if eq .Value "40" }}warn{{ else if eq .Value "30" }}info{{ else if eq .Value "20" }}debug{{ else if .Value }}{{ .Value }}{{ else }}otro{{ end }}
      - labels:
          level: nivel
